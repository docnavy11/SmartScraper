[project]
name = "smartscraper"
version = "0.1.0"
description = "AI builds the scraper, a deterministic runner executes it, the AI is called back only when it breaks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["scraping", "agent", "llm", "playwright", "mcp", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.7",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0.54,<2.1",
  "aiosqlite>=0.22",
  "alembic>=1.20",
  "playwright>=1.63",
  "patchright>=1.62",
  "curl-cffi>=0.16",
  "lxml>=5.3",
  "cssselect>=1.2",
  "httpx2>=2.13",
  "tenacity>=9.1",
  "huey>=3.4",
  "fastapi>=0.141",
  "uvicorn[standard]>=0.34",
  "jinja2>=3.1",
  "python-multipart>=0.0.20",
  "sse-starlette>=3.4",
  "fastmcp>=4.0",
  "claude-agent-sdk>=0.2.150",
  "anthropic>=1.6",
  "apprise>=1.13",
  "pyotp>=2.10",
  "cryptography>=44",
]

[project.optional-dependencies]
export = ["duckdb>=1.5", "pyarrow>=18"]
s3 = ["boto3>=1.43"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "pytest-cov>=6.0", "ruff>=0.9", "mypy>=1.14"]

[project.urls]
Homepage = "https://github.com/docnavy11/SmartScraper"
Source = "https://github.com/docnavy11/SmartScraper"
Issues = "https://github.com/docnavy11/SmartScraper/issues"

[project.scripts]
smartscraper = "smartscraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
